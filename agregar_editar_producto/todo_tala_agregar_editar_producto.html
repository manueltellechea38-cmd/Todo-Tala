<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo Tala | Nuevo producto</title><link rel="stylesheet" href="estilos.css?v=1.3">
</head>
<body>
<main class="app-page"><section class="app-card app-card--narrow">
<header class="app-header"><button id="btn-volver" class="icon-button" type="button" aria-label="Volver">←</button><h1>Nuevo producto</h1></header>
<section class="content">
<form id="form-producto" class="form-grid" novalidate>
<section class="image-upload form-grid__full"><strong>Imagen del producto</strong><input id="imagen" type="file" accept="image/*"><img id="vista-previa" class="image-preview" alt="Vista previa del producto"></section>
<label class="form-group form-grid__full">Nombre *<input id="nombre" type="text"></label>
<label class="form-group">Marca *<input id="marca" type="text"></label>
<label class="form-group">Categoría *<select id="categoria"><option>Panadería</option><option>Repostería</option><option>Almacén</option><option>Indumentaria</option><option>Tecnología</option><option>Ferretería</option></select></label>
<label class="form-group">Precio *<input id="precio" type="number" min="0"></label>
<label class="form-group">Stock *<input id="stock" type="number" min="0"></label>
<label class="form-group form-grid__full">Descripción<textarea id="descripcion"></textarea></label>
<p id="error-form" class="error-message form-grid__full">Completá nombre, marca, precio y stock correctamente.</p>
<button class="btn btn--primary btn--block form-grid__full" type="submit">Guardar producto</button>
</form>
</section>
</section></main>
<script src="../assets/app.js?v=1.3"></script><script src="../assets/acceso.js?v=1.3"></script><script src="producto.js?v=1.3"></script>
</body></html>
