<!DOCTYPE html>
<!-- Todo Tala v1.0.0 -->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo Tala | Nuevo producto</title>
    <link rel="stylesheet" href="estilos.css?v=1.0.0">
    <link rel="stylesheet" href="../assets/tema.css?v=1.0.0">
</head>
<body>
    <main class="app-page">
        <section class="app-card product-form-card">
            <!-- Encabezado del alta de producto. -->
            <header class="app-header">
                <section class="app-header__title">
                    <a class="icon-button back-link" href="../gestionar_productos/todo_tala_gestion_productos.html" aria-label="Volver">&#8592;</a>
                    <h1>Nuevo producto</h1>
                </section>
            </header>

            <section class="content">
                <form id="form-producto" class="form-grid" novalidate>
                    <!-- Imagen opcional del producto. -->
                    <section class="image-upload form-grid__full">
                        <strong>Imagen del producto</strong>
                        <input id="imagen" type="file" accept="image/jpeg,image/png,image/webp" hidden>
                        <img id="vista-previa" class="image-preview" alt="Vista previa del producto">
                        <span class="helper">Podés tomar una foto o elegirla desde tus archivos.</span>
                    </section>

                    <label class="form-group form-grid__full">Nombre *<input id="nombre" type="text"></label>
                    <label class="form-group">Marca *<input id="marca" type="text"></label>
                    <label class="form-group">Categoría *<select id="categoria" required><option value="">Cargando categorías...</option></select></label>
                    <label class="form-group">Precio *<input id="precio" type="number" min="0"></label>
                    <label class="form-group">Stock *<input id="stock" type="number" min="0"></label>
                    <label class="form-group form-grid__full">Descripción<textarea id="descripcion"></textarea></label>
                    <p id="error-form" class="error-message form-grid__full">Completá nombre, marca, precio y stock correctamente.</p>
                    <button class="btn btn--primary btn--block form-grid__full" type="submit">Guardar producto</button>
                </form>
            </section>

                        <nav class="commerce-nav" aria-label="Navegación del comercio">
                <a href="../panel_comercio/todo_tala_panel_comercio.html"><span aria-hidden="true">🏠</span><span>Panel</span></a>
                <a class="active" href="../gestionar_productos/todo_tala_gestion_productos.html"><span aria-hidden="true">📦</span><span>Productos</span></a>
                <a href="../pedidos_recibidos/todo_tala_pedidos_recibidos.html"><span aria-hidden="true">🧾</span><span>Pedidos</span></a>
                <a href="../gestionar_promociones/todo_tala_gestion_promociones.html"><span aria-hidden="true">🏷️</span><span>Promociones</span></a>
                <a data-solo-jefe href="../gestionar_empleados/todo_tala_gestion_empleados.html"><span aria-hidden="true">👥</span><span>Empleados</span></a>
            </nav>
        </section>
    </main>

   <script src="../assets/config.js?v=1.0.0"></script>
<script src="../assets/sesion.js?v=1.0.0"></script>
<script src="../assets/app.js?v=1.0.0"></script>
<script src="../assets/acceso.js?v=1.0.0"></script>
<script src="producto.js?v=1.0.0"></script>
<script src="../assets/camara-producto.js?v=1.0.0"></script>
    <script src="../assets/tema.js?v=1.0.0"></script>
</body>
</html>
