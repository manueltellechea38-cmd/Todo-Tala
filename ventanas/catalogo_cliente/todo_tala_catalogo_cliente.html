<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo</title>

    <link rel="stylesheet" href="/catalogo_cliente/estilos.css">
</head>

<body>

<main class="profile-page">

    <section class="profile-card">

        <header class="catalog-header">

            <h1>Catálogo</h1>

            <nav class="top-nav">

                <button aria-label="Mis pedidos">
                    Pedidos
                </button>

                <button aria-label="Mi perfil">
                    Perfil
                </button>

                <button aria-label="Cerrar sesión">
                    Salir
                </button>

            </nav>

        </header>

        <section class="search-area">

            <input
                id="search-input"
                type="search"
                placeholder="Buscar productos o comercios..."
                oninput="filtrar()">

        </section>

        <section class="filter-area">

            <label for="filtro-comercio">
                Comercio
            </label>

            <select
                id="filtro-comercio"
                onchange="filtrar()">

                <option value="">Todos los comercios</option>
                <option value="Panadería El Sol">Panadería El Sol</option>
                <option value="Ferretería Tala">Ferretería Tala</option>
                <option value="TecnoTala">TecnoTala</option>
                <option value="Calzados Tala">Calzados Tala</option>

            </select>

        </section>

        <section
            class="product-list"
            id="lista-productos">

        </section>

        <nav class="bottom-nav">

            <a href="#" class="active">
                Catálogo
            </a>

            <a href="#">
                Pedidos
            </a>

            <a href="#">
                Perfil
            </a>

        </nav>

    </section>

</main>

<script src="catalogo.js"></script>

</body>

</html>
