<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión</title>

    <link rel="stylesheet"
          href="/pantalla_login/estilos.css">
    
    <link rel="stylesheet" href="/pantalla_login/login.js">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

</head>

<body>

<main class="login-page">

    <section class="login-card">

        <header class="login-header">

            <div class="logo-circle">

                <i class="ti ti-building-store"></i>

            </div>

            <h1>Todo Tala</h1>

            <p>Iniciá sesión en tu cuenta</p>

        </header>

        <form id="login-form"
              class="login-form"
              action=""
              method="post">

            <label for="email">
                Correo electrónico
            </label>

            <input
                id="email"
                name="email"
                type="email"
                placeholder="nombre@correo.com"
                autocomplete="email"
                autocapitalize="off"
                autocorrect="off"
                required>

            <label for="password">
                Contraseña
            </label>

            <input
                id="password"
                name="password"
                type="password"
                placeholder="Tu contraseña"
                autocomplete="current-password"
                required>

            <a href="#" class="forgot">
                ¿Olvidaste tu contraseña?
            </a>

            <button
                class="btn-primary"
                type="submit">

                Iniciar sesión

            </button>

            <div class="divider">

                <span></span>

                <p>o</p>

                <span></span>

            </div>

            <p class="register">

                ¿No tenés cuenta?

                <a href="#">
                    Registrate
                </a>

            </p>

        </form>

    </section>

</main>

<script src="login.js"></script>

</body>

</html>
