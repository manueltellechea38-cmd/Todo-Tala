<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Pedidos recibidos</title>

    <link rel="stylesheet"
          href="/pedidos_recibidos/estilos.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

</head>

<body>

<main class="page-container">

    <section class="card">

        <header class="card-header">

            <button class="back-button"
                    aria-label="Volver">

                <i class="ti ti-arrow-left"></i>

            </button>

            <h1>
                Pedidos recibidos
            </h1>

        </header>

        <nav class="tabs">

            <button
                id="tab-todos"
                class="tab active">

                Todos

            </button>

            <button
                id="tab-Pendiente"
                class="tab">

                Pendiente

            </button>

            <button
                id="tab-Confirmado"
                class="tab">

                Confirmado

            </button>

            <button
                id="tab-Finalizado"
                class="tab">

                Finalizado

            </button>

        </nav>

        <ul id="lista-pedidos"
            class="orders-list">

        </ul>

    </section>

</main>

<script src="pedidos-recibidos.js"></script>

</body>

</html>
