<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Todo Tala</title>

    <link rel="stylesheet"
          href="/pantalla_inicio/estilos.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

</head>

<body>

<main class="home-page">

    <section class="home-card">

        <header class="home-header">

            <section class="logo">

                <i class="ti ti-building-store"></i>

                <h1>Todo Tala</h1>

            </section>

            <button class="menu-button">

                <i class="ti ti-menu-2"></i>

            </button>

        </header>

        <section class="search-area">

            <button class="search-box">

                <i class="ti ti-search"></i>

                <span>Buscar productos, comercios...</span>

            </button>

        </section>

        <section class="auth-buttons">

            <button class="btn btn-primary">

                Iniciar sesión

            </button>

            <button class="btn">

                Registrarse

            </button>

        </section>

        <section class="promotions">

            <header>

                <h2>Promociones destacadas</h2>

                <i class="ti ti-tag"></i>

            </header>

            <article class="promo-list">

                <article class="promo-card coral">

                    <h3>2x1 panadería</h3>

                    <p>Panadería El Sol</p>

                </article>

                <article class="promo-card teal">

                    <h3>20% ferretería</h3>

                    <p>Ferretería Tala</p>

                </article>

                <article class="promo-card amber">

                    <h3>Envío gratis</h3>

                    <p>Almacén Don Pepe</p>

                </article>

            </article>

        </section>

        <section class="products">

            <header>

                <h2>Productos recientes</h2>

            </header>

            <section class="product-grid">

                <article class="product-card">

                    <figure>

                        <i class="ti ti-shopping-bag"></i>

                    </figure>

                    <h3>Zapatillas urbanas</h3>

                    <p>Calzados Tala · $1.200</p>

                </article>

                <article class="product-card">

                    <figure>

                        <i class="ti ti-device-laptop"></i>

                    </figure>

                    <h3>Auriculares BT</h3>

                    <p>TecnoTala · $850</p>

                </article>

            </section>

        </section>

        <section class="commerce-button">

            <button class="btn">

                <i class="ti ti-building-store"></i>

                Ver todos los comercios

            </button>

        </section>

        <nav class="bottom-nav">

            <a href="#" class="active">

                <i class="ti ti-home"></i>

                <span>Inicio</span>

            </a>

            <a href="#">

                <i class="ti ti-search"></i>

                <span>Buscar</span>

            </a>

            <a href="#">

                <i class="ti ti-building-store"></i>

                <span>Comercios</span>

            </a>

            <a href="#">

                <i class="ti ti-user"></i>

                <span>Perfil</span>

            </a>

        </nav>

    </section>

</main>

</body>

</html>
