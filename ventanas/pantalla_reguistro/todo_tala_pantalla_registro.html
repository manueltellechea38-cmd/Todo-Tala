<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Crear cuenta</title>

    <link rel="stylesheet"
          href="/pantalla_reguistro/estilos.css">

    <link rel="stylesheet" href="reguistro.js">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

</head>

<body>

<main class="register-page">

    <section class="register-card">

        <header class="register-header">

            <button class="back-button">

                <i class="ti ti-arrow-left"></i>

            </button>

            <h1>Crear cuenta</h1>

        </header>

        <form class="register-form">

            <label>Tipo de cuenta</label>

            <section class="account-selector">

                <button
                    type="button"
                    id="btn-cliente"
                    class="active">

                    <i class="ti ti-user"></i>

                    Cliente

                </button>

                <button
                    type="button"
                    id="btn-comercio">

                    <i class="ti ti-building-store"></i>

                    Comercio

                </button>

            </section>

            <label for="nombre">Nombre</label>

            <input
                id="nombre"
                type="text"
                placeholder="Nombre y apellido">

            <label for="email">Correo electrónico *</label>

            <input
                id="email-input"
                type="email"
                placeholder="nombre@correo.com">

            <p id="email-error" class="error-msg">

                <i class="ti ti-alert-circle"></i>

                Ese correo ya está registrado.

            </p>

            <label for="password">Contraseña *</label>

            <input
                id="password"
                type="password"
                placeholder="Mínimo 8 caracteres">

            <label for="confirm-password">
                Confirmar contraseña *
            </label>

            <input
                id="confirm-password"
                type="password"
                placeholder="Repetir contraseña">

            <section id="campos-comercio"
                     class="business-fields">

                <h2>

                    <i class="ti ti-building-store"></i>

                    Datos del comercio

                </h2>

                <label>Nombre del comercio</label>

                <input
                    type="text"
                    placeholder="Ej: Panadería El Sol">

                <label>Rubro</label>

                <select>

                    <option>Alimentación</option>
                    <option>Indumentaria</option>
                    <option>Ferretería</option>
                    <option>Tecnología</option>
                    <option>Otro</option>

                </select>

                <label>Dirección</label>

                <input
                    type="text"
                    placeholder="Calle y número">

                <label>Teléfono</label>

                <input
                    type="tel"
                    placeholder="09XXXXXXX">

            </section>

            <button
                class="btn-primary"
                type="submit">

                Registrarse

            </button>

            <button
                class="btn-secondary"
                type="button">

                Ya tengo cuenta, iniciar sesión

            </button>

        </form>

    </section>

</main>

<script src="registro.js"></script>

</body>

</html>
