<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar producto</title>

    <link rel="stylesheet" href="/editar_producto/estilos.css">
</head>

<body>

<main class="profile-page">

    <section class="profile-card">

        <header class="profile-header">

            <button class="back-button" aria-label="Volver">
                ←
            </button>

            <h1>Editar producto</h1>

        </header>

        <form class="product-form" onsubmit="return guardar(event)">

            <button type="button" class="image-upload">

                <span class="image-icon">🎂</span>

                <span>Cambiar imagen</span>

            </button>

            <label for="nombre">
                Nombre del producto
            </label>

            <input
                type="text"
                id="nombre"
                value="Torta de chocolate">

            <label for="descripcion">
                Descripción
            </label>

            <textarea
                id="descripcion"
                rows="4">Torta de chocolate casera, cubierta con ganache y decorada con frutos rojos. Ideal para cumpleaños y eventos.</textarea>

            <section class="form-row">

                <article>

                    <label for="precio">
                        Precio
                    </label>

                    <input
                        type="number"
                        id="precio"
                        value="950">

                </article>

                <article>

                    <label for="stock">
                        Stock
                    </label>

                    <input
                        type="number"
                        id="stock"
                        value="0">

                </article>

            </section>

            <fieldset class="toggle-field">

                <legend>
                    Estado del producto
                </legend>

                <span id="estado-label">
                    No disponible
                </span>

                <label class="switch">

                    <input
                        type="checkbox"
                        id="disponible-toggle"
                        onchange="toggleEstado()">

                    <span class="slider"></span>

                </label>

            </fieldset>

            <button
                type="submit"
                class="btn">

                Guardar cambios

            </button>

            <button
                type="button"
                class="btn btn-danger btn-outline">

                Eliminar producto

            </button>

        </form>

    </section>

</main>

<script src="editar-producto.js"></script>

</body>

</html>
