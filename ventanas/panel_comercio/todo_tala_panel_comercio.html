<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Panel del comercio</title>

    <link rel="stylesheet"
          href="estilos.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

</head>

<body>

<main class="panel-page">

    <section class="commerce-panel">

        <header class="panel-header">

            <section>

                <h1>Panadería El Sol</h1>

                <p>Panel del comercio</p>

            </section>

            <button
                class="icon-button"
                aria-label="Editar perfil">

                <i class="ti ti-building-store"></i>

            </button>

        </header>

        <section class="summary">

            <h2>Resumen rápido</h2>

            <ul class="summary-list">

                <li>

                    <i class="ti ti-package"></i>

                    <strong>14</strong>

                    <span>Productos</span>

                </li>

                <li>

                    <i class="ti ti-shopping-bag warning"></i>

                    <strong>5</strong>

                    <span>Pedidos</span>

                </li>

                <li>

                    <i class="ti ti-tag success"></i>

                    <strong>3</strong>

                    <span>Promociones</span>

                </li>

            </ul>

        </section>

        <nav class="quick-access">

            <h2>Accesos rápidos</h2>

            <ul>

                <li>

                    <button class="primary">

                        <i class="ti ti-circle-plus"></i>

                        Agregar producto

                    </button>

                </li>

                <li>

                    <button>

                        <i class="ti ti-package"></i>

                        Ver productos

                    </button>

                </li>

                <li>

                    <button>

                        <i class="ti ti-shopping-bag"></i>

                        Ver pedidos

                        <span class="badge">
                            5 nuevos
                        </span>

                    </button>

                </li>

                <li>

                    <button>

                        <i class="ti ti-tag"></i>

                        Ver promociones

                    </button>

                </li>

                <li>

                    <button>

                        <i class="ti ti-user-edit"></i>

                        Editar perfil

                    </button>

                </li>

            </ul>

        </nav>

    </section>

</main>

</body>

</html>
