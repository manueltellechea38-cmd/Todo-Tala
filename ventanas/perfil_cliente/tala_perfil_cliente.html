<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil</title>

    <link rel="stylesheet" href="/perfil_cliente/estilos.css">
</head>

<body>

    <main class="profile-page">

        <section class="profile-card">

            <header class="profile-header">

                <button class="back-button" aria-label="Volver">
                    ←
                </button>

                <h1>Mi perfil</h1>

            </header>

            <section class="profile-info">

                <figure class="avatar">
                    MR
                </figure>

                <h2>Manuel Rodríguez</h2>

                <p class="member-since">
                    Cliente desde mayo 2026
                </p>

            </section>

            <section class="profile-details">

                <article class="detail-item">

                    <section class="detail-text">
                        <h3>Nombre</h3>
                        <p>Manuel Rodríguez</p>
                    </section>

                </article>

                <article class="detail-item">

                    <section class="detail-text">
                        <h3>Correo</h3>
                        <p>manuel.rodriguez@correo.com</p>
                    </section>

                </article>

                <article class="detail-item">

                    <section class="detail-text">
                        <h3>Teléfono <span>(opcional)</span></h3>
                        <p>099 123 456</p>
                    </section>

                </article>

            </section>

            <section class="profile-actions">

                <button class="btn">
                    Editar datos
                </button>

                <button class="btn btn-danger">
                    Cerrar sesión
                </button>

            </section>

            <nav class="bottom-nav">

                <a href="#">Inicio</a>

                <a href="#">Buscar</a>

                <a href="#">Comercios</a>

                <a href="#" class="active">Perfil</a>

            </nav>

        </section>

    </main>

</body>

</html>
