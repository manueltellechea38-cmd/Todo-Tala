<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo Tala | Catálogo</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body class="catalog-page">
    <main class="app-page">
        <section class="app-card catalog-shell">
            <header class="catalog-header">
                <a class="brand" href="../pantalla_inicio/todo_tala_pantalla_inicio.html" aria-label="Ir al inicio">
                    <span class="brand-mark">TT</span>
                    <span>Todo Tala</span>
                </a>

                <nav class="catalog-actions" aria-label="Acciones del cliente">
                    <button id="btn-pedidos" class="btn btn--secondary" type="button">Mis pedidos</button>
                    <button id="btn-carrito" class="btn btn--primary" type="button">
                        Carrito
                        <span id="contador-carrito" class="cart-count">0</span>
                    </button>
                </nav>
            </header>

            <section class="catalog-hero">
                <p class="section-kicker">Comercios locales</p>
                <h1>Encontrá productos sin recorrer comercio por comercio.</h1>
                <p>Buscá, compará disponibilidad y armá tu pedido para retirar directamente en el local.</p>
            </section>

            <section class="catalog-content">
                <aside class="filters" aria-label="Filtros del catálogo">
                    <div class="filters-heading">
                        <div>
                            <p class="section-kicker">Filtrar</p>
                            <h2>Refiná tu búsqueda</h2>
                        </div>
                        <button id="btn-limpiar" class="text-button" type="button">Limpiar</button>
                    </div>

                    <div class="form-group">
                        <label for="search-input">Buscar</label>
                        <input id="search-input" type="search" placeholder="Producto, marca o comercio">
                    </div>

                    <div class="form-group">
                        <label for="filtro-comercio">Comercio</label>
                        <select id="filtro-comercio">
                            <option value="">Todos los comercios</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="filtro-categoria">Categoría</label>
                        <select id="filtro-categoria">
                            <option value="">Todas las categorías</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="filtro-disponibilidad">Disponibilidad</label>
                        <select id="filtro-disponibilidad">
                            <option value="">Todos</option>
                            <option value="disponible">Con stock</option>
                            <option value="bajo">Stock bajo</option>
                            <option value="sin-stock">Sin stock</option>
                        </select>
                    </div>

                    <label class="check-row" for="filtro-promocion">
                        <input id="filtro-promocion" type="checkbox">
                        <span>Solo productos en promoción</span>
                    </label>

                    <div class="price-grid">
                        <div class="form-group">
                            <label for="precio-min">Precio mín.</label>
                            <input id="precio-min" type="number" min="0" placeholder="$0">
                        </div>
                        <div class="form-group">
                            <label for="precio-max">Precio máx.</label>
                            <input id="precio-max" type="number" min="0" placeholder="Sin límite">
                        </div>
                    </div>
                </aside>

                <section class="results-area">
                    <header class="results-heading">
                        <div>
                            <p id="resumen-catalogo" class="muted"></p>
                            <h2>Productos disponibles en Todo Tala</h2>
                        </div>
                        <select id="orden-productos" aria-label="Ordenar productos">
                            <option value="relevancia">Orden recomendado</option>
                            <option value="precio-asc">Menor precio</option>
                            <option value="precio-desc">Mayor precio</option>
                            <option value="nombre">Nombre A-Z</option>
                        </select>
                    </header>

                    <section id="lista-productos" class="product-grid" aria-live="polite"></section>
                </section>
            </section>

            <nav class="bottom-nav" aria-label="Navegación del cliente">
                <a href="../pantalla_inicio/todo_tala_pantalla_inicio.html">Inicio</a>
                <a href="../resultados_busqueda/todo_tala_resultados_busqueda.html">Buscar</a>
                <a class="active" href="todo_tala_catalogo_cliente.html">Catálogo</a>
                <a href="../perfil_cliente/tala_perfil_cliente.html">Perfil</a>
            </nav>
        </section>
    </main>

    <script src="../assets/app.js"></script>
    <script src="catalogo.js"></script>
</body>
</html>
