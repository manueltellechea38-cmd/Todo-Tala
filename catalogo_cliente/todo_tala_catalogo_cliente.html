<!DOCTYPE html>
<!-- Todo Tala v1.0.0 -->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo Tala | Catálogo</title>
    <link rel="stylesheet" href="estilos.css?v=1.0.0">
    <link rel="stylesheet" href="../assets/tema.css?v=1.0.0">

<style id="ajuste-fotos-catalogo">
.product-card .product-image {
    display: grid !important;
    place-items: center !important;
    height: 190px !important;
    min-height: 190px !important;
    flex: 0 0 190px !important;
    overflow: hidden !important;
}
.product-card .product-image img {
    position: static !important;
    display: block !important;
    width: auto !important;
    height: auto !important;
    max-width: 100% !important;
    max-height: 100% !important;
    object-fit: contain !important;
    object-position: center !important;
}
</style>

<style id="fotos-completas-final">
.preview-card .product-placeholder {
    display: grid !important;
    place-items: center !important;
    height: 150px !important;
    min-height: 150px !important;
    overflow: hidden !important;
}
.preview-card .product-placeholder img {
    display: block !important;
    width: auto !important;
    height: auto !important;
    max-width: 100% !important;
    max-height: 100% !important;
    object-fit: contain !important;
    object-position: center !important;
}
.product-card .product-image {
    display: grid !important;
    place-items: center !important;
    height: 210px !important;
    min-height: 210px !important;
    flex: 0 0 210px !important;
    overflow: hidden !important;
}
.product-card .product-image img {
    display: block !important;
    width: auto !important;
    height: auto !important;
    max-width: 100% !important;
    max-height: 100% !important;
    object-fit: contain !important;
    object-position: center !important;
}
</style>

<style id="solo-foto-completa-catalogo">
body .product-card > .product-image {
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    height: 220px !important;
    min-height: 220px !important;
    flex: 0 0 220px !important;
    overflow: hidden !important;
}
body .product-card > .product-image > img {
    position: static !important;
    display: block !important;
    width: auto !important;
    height: auto !important;
    max-width: 100% !important;
    max-height: 220px !important;
    object-fit: contain !important;
    object-position: center !important;
}
</style>
</head>
<body>
    <main class="app-page catalog-page">
        <section class="app-card catalog-shell">
            <!-- Encabezado del catálogo. -->
            <header class="catalog-header">
                <a class="brand" href="../pantalla_inicio/todo_tala_pantalla_inicio.html">
                    <span class="brand-mark">TT</span>
                    <strong>Todo Tala</strong>
                </a>
                <nav class="catalog-actions" aria-label="Acciones del cliente">
                    <a class="btn btn--secondary" href="../mis_pedidos/todo_tala_mis_pedidos.html">Mis pedidos</a>
                    <a class="btn btn--primary" href="../carrito_pedidos/todo_tala_carrito_pedido.html">Carrito <span id="contador-carrito" class="cart-count">0</span></a>
                </nav>
            </header>

            <section class="catalog-hero">
                <h1>Catálogo de productos</h1>
                <p>Buscá productos, compará precios y revisá el stock disponible.</p>
            </section>

            <section class="catalog-content">
                <!-- Filtros de búsqueda. -->
                <aside class="filters" aria-label="Filtros del catálogo">
                    <header class="filters-heading">
                        <h2>Filtros</h2>
                        <button id="btn-limpiar" class="text-button" type="button">Limpiar</button>
                    </header>

                    <label class="form-group" for="search-input">Buscar<input id="search-input" type="search" placeholder="Producto, marca o comercio"></label>
                    <label class="form-group" for="filtro-comercio">Comercio<select id="filtro-comercio"><option value="">Todos los comercios</option></select></label>
                    <label class="form-group" for="filtro-categoria">Categoría<select id="filtro-categoria"><option value="">Todas las categorías</option></select></label>
                    <label class="form-group" for="filtro-disponibilidad">Disponibilidad<select id="filtro-disponibilidad"><option value="">Todos</option><option value="disponible">Con stock</option><option value="bajo">Stock bajo</option><option value="sin-stock">Sin stock</option></select></label>
                    <label class="check-row" for="filtro-promocion"><input id="filtro-promocion" type="checkbox">Solo productos en promoción</label>

                    <section class="price-grid">
                        <label class="form-group" for="precio-min">Precio mín.<input id="precio-min" type="number" min="0" placeholder="$0"></label>
                        <label class="form-group" for="precio-max">Precio máx.<input id="precio-max" type="number" min="0" placeholder="Sin límite"></label>
                    </section>
                </aside>

                <!-- Resultados del catálogo. -->
                <section class="results-area">
                    <header class="results-heading">
                        <section>
                            <p id="resumen-catalogo" class="muted"></p>
                            <h2>Productos</h2>
                        </section>
                        <select id="orden-productos" aria-label="Ordenar productos">
                            <option value="relevancia">Orden recomendado</option>
                            <option value="precio-asc">Menor precio</option>
                            <option value="precio-desc">Mayor precio</option>
                            <option value="nombre">Nombre A-Z</option>
                        </select>
                    </header>
                    <section id="lista-productos" class="product-grid" aria-live="polite"></section>
                </section>
            </section>

            <nav class="bottom-nav" aria-label="Navegación del cliente">
                <a href="../pantalla_inicio/todo_tala_pantalla_inicio.html"><span aria-hidden="true">🏠</span><span>Inicio</span></a>
                <a href="../resultados_busqueda/todo_tala_resultados_busqueda.html"><span aria-hidden="true">🔎</span><span>Buscar</span></a>
                <a class="active" href="todo_tala_catalogo_cliente.html"><span aria-hidden="true">🛍️</span><span>Catálogo</span></a>
                <a href="../mis_pedidos/todo_tala_mis_pedidos.html"><span aria-hidden="true">🧾</span><span>Pedidos</span></a>
                <a href="../favoritos_cliente/todo_tala_favoritos.html"><span aria-hidden="true">⭐</span><span>Favoritos</span></a><a href="../perfil_cliente/tala_perfil_cliente.html"><span aria-hidden="true">👤</span><span>Perfil</span></a>
            </nav>
        </section>
    </main>

<script src="../assets/config.js?v=1.0.0"></script>
<script src="../assets/sesion.js?v=1.0.0"></script>
<script src="../assets/app.js?v=1.0.0"></script>
<script src="../assets/acceso.js?v=1.0.0"></script>
<script src="catalogo.js?v=1.0.0"></script>
    <script src="../assets/tema.js?v=1.0.0"></script>
</body>
</html>
