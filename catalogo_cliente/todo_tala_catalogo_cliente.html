<!DOCTYPE html>
<!-- Declara HTML5. -->
<html lang="es">
<!-- Define idioma español. -->
<head>
    <!-- Configura caracteres. -->
    <meta charset="UTF-8">
    <!-- Activa diseño adaptable. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Título del navegador. -->
    <title>Todo Tala | Catálogo</title>
    <!-- Carga estilos de esta pantalla. -->
    <link rel="stylesheet" href="estilos.css">
</head>
<!-- Comienza la interfaz. -->
<body>
    <!-- Contenedor general. -->
    <main class="app-page">
        <!-- Tarjeta principal. -->
        <section class="app-card">
            <!-- Encabezado. -->
            <header class="app-header catalog-top">
                <!-- Título y subtítulo. -->
                <div>
                    <!-- Título principal. -->
                    <h1>Catálogo</h1>
                    <!-- Texto explicativo. -->
                    <p class="muted">Productos publicados por comercios locales.</p>
                </div>
                <!-- Acciones rápidas. -->
                <div class="toolbar" style="margin:0;">
                    <!-- Abre mis pedidos. -->
                    <button id="btn-pedidos" class="btn btn--secondary" type="button">Mis pedidos</button>
                    <!-- Abre el carrito. -->
                    <button id="btn-carrito" class="btn btn--primary" type="button">Carrito <span id="contador-carrito" class="badge cart-count">0</span></button>
                </div>
            </header>
            <!-- Contenido del catálogo. -->
            <section class="content">
                <!-- Barra de búsqueda y filtros. -->
                <div class="toolbar">
                    <!-- Campo de búsqueda. -->
                    <input id="search-input" class="toolbar__grow" type="search" placeholder="Buscar por producto, marca o comercio...">
                    <!-- Filtro de comercio. -->
                    <select id="filtro-comercio">
                        <!-- Opción general. -->
                        <option value="">Todos los comercios</option>
                    </select>
                    <!-- Filtro de categoría. -->
                    <select id="filtro-categoria">
                        <!-- Opción general. -->
                        <option value="">Todas las categorías</option>
                    </select>
                </div>
                <!-- Resumen del filtro actual. -->
                <p id="resumen-catalogo" class="muted" style="margin-bottom:12px;"></p>
                <!-- Lista renderizada con JavaScript. -->
                <section id="lista-productos" class="product-grid"></section>
            </section>
            <!-- Navegación del cliente. -->
            <nav class="bottom-nav" aria-label="Navegación del cliente">
                <!-- Inicio. -->
                <a href="../pantalla_inicio/todo_tala_pantalla_inicio.html">Inicio</a>
                <!-- Buscar. -->
                <a href="../resultados_busqueda/todo_tala_resultados_busqueda.html">Buscar</a>
                <!-- Catálogo activo. -->
                <a class="active" href="todo_tala_catalogo_cliente.html">Catálogo</a>
                <!-- Perfil. -->
                <a href="../perfil_cliente/tala_perfil_cliente.html">Perfil</a>
            </nav>
        </section>
    </main>
    <!-- Carga utilidades comunes. -->
    <script src="../assets/app.js"></script>
    <!-- Carga lógica del catálogo. -->
    <script src="catalogo.js"></script>
</body>
<!-- Finaliza el documento. -->
</html>
