<!DOCTYPE html>
<!-- Declara HTML5. -->
<html lang="es">
<!-- Define idioma español. -->
<head>
    <!-- Configura caracteres. -->
    <meta charset="UTF-8">
    <!-- Activa responsive. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Título del navegador. -->
    <title>Todo Tala | Carrito</title>
    <!-- Carga estilos del carrito. -->
    <link rel="stylesheet" href="estilos.css">
</head>
<!-- Comienza la interfaz. -->
<body>
    <!-- Contenedor general. -->
    <main class="app-page">
        <!-- Tarjeta principal. -->
        <section class="app-card app-card--narrow">
            <!-- Encabezado. -->
            <header class="app-header">
                <!-- Agrupa volver y título. -->
                <div class="app-header__title">
                    <!-- Regresa al catálogo. -->
                    <button id="btn-volver" class="icon-button" type="button" aria-label="Volver">←</button>
                    <!-- Título. -->
                    <div>
                        <!-- Nombre de pantalla. -->
                        <h1>Tu pedido</h1>
                        <!-- Aclara el modelo de retiro. -->
                        <p class="muted">Confirmá y retiralo mostrando el código generado.</p>
                    </div>
                </div>
            </header>
            <!-- Contenido. -->
            <section class="content">
                <!-- Lista dinámica del carrito. -->
                <section id="lista-carrito"></section>
                <!-- Observación simple. -->
                <div class="form-group" style="margin-top:16px;">
                    <!-- Etiqueta. -->
                    <label for="observacion">Observación para el comercio</label>
                    <!-- Campo de texto. -->
                    <textarea id="observacion" placeholder="Ej: lo retiro después de las 18:00"></textarea>
                    <!-- Ayuda. -->
                    <p class="helper">Opcional. En una versión con backend esta observación quedará asociada al pedido.</p>
                </div>
                <!-- Resumen de totales. -->
                <section class="cart-total">
                    <!-- Subtotal. -->
                    <div class="total-row"><span>Subtotal</span><span id="subtotal-total">$0</span></div>
                    <!-- Total final. -->
                    <div class="total-row total-row--strong"><span>Total</span><span id="total-total">$0</span></div>
                </section>
                <!-- Acción de confirmar. -->
                <button id="btn-confirmar" class="btn btn--primary btn--block" type="button" style="margin-top:16px;">Confirmar pedido</button>
            </section>
        </section>
    </main>
    <!-- Carga utilidades generales. -->
    <script src="../assets/app.js"></script>
    <!-- Carga la lógica del carrito. -->
    <script src="carrito.js"></script>
</body>
<!-- Finaliza el documento. -->
</html>
