<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo Tala | Producto</title>
    <link rel="stylesheet" href="estilos.css?v=1.3.3">
</head>
<body>
    <main class="app-page">
        <article class="app-card detail-card">
            <!-- Encabezado del detalle. -->
            <header class="app-header">
                <section class="app-header__title">
                    <a class="icon-button back-link" href="../catalogo_cliente/todo_tala_catalogo_cliente.html" aria-label="Volver">←</a>
                    <h1>Detalle del producto</h1>
                </section>
                <button id="btn-favorito" class="icon-button" type="button" aria-label="Favorito">♡</button>
            </header>

            <!-- Información principal del producto. -->
            <section class="content detail-layout">
                <figure id="imagen-producto" class="detail-image">--</figure>

                <section class="detail-info">
                    <header class="detail-title-row">
                        <section>
                            <h1 id="nombre-producto">Producto</h1>
                            <p id="comercio-producto" class="muted"></p>
                        </section>
                        <span id="estado-producto" class="badge"></span>
                    </header>

                    <p class="detail-price"><span id="precio-producto"></span><span id="precio-anterior" class="old-price"></span></p>
                    <p id="meta-producto" class="muted"></p>
                    <p id="descripcion-producto"></p>
                    <p id="stock-producto" class="muted"></p>

                    <!-- Cantidad que se agregará al carrito. -->
                    <section class="quantity-area">
                        <strong>Cantidad</strong>
                        <nav class="quantity-control" aria-label="Cantidad">
                            <button id="btn-restar" type="button">−</button>
                            <span id="cantidad">1</span>
                            <button id="btn-sumar" type="button">+</button>
                        </nav>
                    </section>

                    <button id="btn-agregar" class="btn btn--primary btn--block" type="button">Agregar al carrito</button>
                </section>
            </section>

            <nav class="bottom-nav" aria-label="Navegación del cliente">
                <a href="../pantalla_inicio/todo_tala_pantalla_inicio.html">Inicio</a>
                <a href="../resultados_busqueda/todo_tala_resultados_busqueda.html">Buscar</a>
                <a class="active" href="../catalogo_cliente/todo_tala_catalogo_cliente.html">Catálogo</a>
                <a href="../mis_pedidos/todo_tala_mis_pedidos.html">Pedidos</a>
                <a href="../perfil_cliente/tala_perfil_cliente.html">Perfil</a>
            </nav>
        </article>
    </main>

    <script src="../assets/app.js?v=1.3.3"></script>
    <script src="../assets/acceso.js?v=1.3.3"></script>
    <script src="detalle-producto.js?v=1.3.3"></script>
</body>
</html>
