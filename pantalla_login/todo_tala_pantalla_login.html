<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo Tala | Iniciar sesión</title>
    <link rel="stylesheet" href="estilos.css?v=1.3.3">
</head>
<body>
    <main class="app-page login-page">
        <section class="app-card app-card--narrow login-card">
            <!-- Encabezado de Todo Tala. -->
            <header class="login-header">
                <span class="login-logo">TT</span>
                <section>
                    <h1>Todo Tala</h1>
                    <p>Ingresá a tu cuenta</p>
                </section>
            </header>

            <!-- Formulario de inicio de sesión. -->
            <section class="content login-content">
                <header class="login-title">
                    <h2>Iniciar sesión</h2>
                    <p class="muted">Usá el correo y la contraseña de tu cuenta.</p>
                </header>

                <form id="login-form" class="login-form" novalidate>
                    <label for="email">
                        Correo electrónico
                        <input id="email" type="email" autocomplete="email" placeholder="nombre@correo.com" required>
                    </label>
                    <p id="error-email" class="error-message">Ingresá un correo válido.</p>

                    <label class="password-label" for="password">
                        Contraseña
                        <input id="password" type="password" autocomplete="current-password" placeholder="Tu contraseña" required>
                        <button id="btn-ver-password" class="password-toggle" type="button">Mostrar</button>
                    </label>
                    <p id="error-login" class="error-message">Correo o contraseña incorrectos.</p>

                    <button id="btn-ingresar" class="btn btn--primary btn--block" type="submit">Ingresar</button>
                </form>

                <!-- El registro público permite crear cuentas de Cliente o Jefe. -->
                <section class="register-area">
                    <p>¿Todavía no tenés una cuenta?</p>
                    <a class="btn btn--secondary btn--block" href="../pantalla_registro/todo_tala_pantalla_registro.html">Crear una cuenta</a>
                </section>
            </section>
        </section>
    </main>

    <script src="../assets/app.js?v=1.3.3"></script>
    <script src="../assets/acceso.js?v=1.3.3"></script>
    <script src="login.js?v=1.3.3"></script>
</body>
</html>
