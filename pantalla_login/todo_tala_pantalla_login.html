<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo Tala | Iniciar sesión</title>
    <link rel="stylesheet" href="estilos.css?v=1.3">
</head>
<body>
    <main class="app-page login-page">
        <section class="app-card app-card--narrow login-card">
            <header class="login-header">
                <span class="login-logo">TT</span>
                <section>
                    <p>Comercio digital local</p>
                    <h1>Todo Tala</h1>
                </section>
            </header>

            <section class="content">
                <h2>Iniciar sesión</h2>
                <p class="muted login-text">Ingresá con tu correo y contraseña.</p>

                <form id="login-form" class="login-form" novalidate>
                    <label>
                        Correo electrónico
                        <input id="email" type="email" autocomplete="email" required>
                    </label>
                    <p id="error-email" class="error-message">Ingresá un correo válido.</p>

                    <label class="password-label">
                        Contraseña
                        <input id="password" type="password" autocomplete="current-password" required>
                        <button id="btn-ver-password" class="password-toggle" type="button">Mostrar</button>
                    </label>
                    <p id="error-login" class="error-message">Correo o contraseña incorrectos.</p>

                    <button id="btn-ingresar" class="btn btn--primary btn--block" type="submit">Ingresar</button>
                    <a class="btn btn--secondary btn--block" href="../pantalla_reguistro/todo_tala_pantalla_registro.html">Crear una cuenta</a>
                </form>
            </section>
        </section>
    </main>

    <script src="../assets/app.js?v=1.3"></script>
    <script src="../assets/acceso.js?v=1.3"></script>
    <script src="login.js?v=1.3"></script>
</body>
</html>
