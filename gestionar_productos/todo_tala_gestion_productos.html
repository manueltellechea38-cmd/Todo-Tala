<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo Tala | Gestionar productos</title>
    <link rel="stylesheet" href="estilos.css?v=1.3.3">
</head>
<body>
    <main class="app-page">
        <section class="app-card products-card">
            <!-- Encabezado de productos. -->
            <header class="app-header">
                <section class="app-header__title">
                    <a class="icon-button back-link" href="../panel_comercio/todo_tala_panel_comercio.html" aria-label="Volver">←</a>
                    <section>
                        <h1>Mis productos</h1>
                        <p class="muted">Gestioná publicaciones y stock del comercio.</p>
                    </section>
                </section>
                <a class="btn btn--primary" href="../agregar_editar_producto/todo_tala_agregar_editar_producto.html">Agregar producto</a>
            </header>

            <section class="content">
                <!-- Búsqueda y filtro de visibilidad. -->
                <form class="toolbar" id="filtros-productos">
                    <input id="buscar-producto" class="toolbar__grow" type="search" placeholder="Buscar producto">
                    <select id="filtro-visibilidad">
                        <option value="">Todos</option>
                        <option value="visible">Publicados</option>
                        <option value="oculto">Ocultos</option>
                    </select>
                </form>

                <section id="lista-productos" class="product-list"></section>
            </section>

            <nav class="commerce-nav" aria-label="Navegación del comercio">
                <a href="../panel_comercio/todo_tala_panel_comercio.html">Panel</a>
                <a class="active" href="todo_tala_gestion_productos.html">Productos</a>
                <a href="../pedidos_recibidos/todo_tala_pedidos_recibidos.html">Pedidos</a>
                <a href="../gestionar_promociones/todo_tala_gestion_promociones.html">Promociones</a>
                <a data-solo-jefe href="../gestionar_empleados/todo_tala_gestion_empleados.html">Empleados</a>
            </nav>
        </section>
    </main>

    <script src="../assets/app.js?v=1.3.3"></script>
    <script src="../assets/acceso.js?v=1.3.3"></script>
    <script src="productos.js?v=1.3.3"></script>
</body>
</html>
