<!DOCTYPE html>
<!-- Declara HTML5. -->
<html lang="es">
<!-- Define idioma. -->
<head>
    <!-- Configura caracteres. -->
    <meta charset="UTF-8">
    <!-- Activa responsive. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Título de pestaña. -->
    <title>Todo Tala | Mis pedidos</title>
    <!-- Carga estilos. -->
    <link rel="stylesheet" href="estilos.css">
</head>
<!-- Comienza la interfaz. -->
<body>
    <!-- Contenedor general. -->
    <main class="app-page">
        <!-- Tarjeta principal. -->
        <section class="app-card">
            <!-- Encabezado. -->
            <header class="app-header">
                <!-- Agrupa volver y título. -->
                <div class="app-header__title">
                    <!-- Regresa al catálogo. -->
                    <button id="btn-volver" class="icon-button" type="button" aria-label="Volver">←</button>
                    <!-- Título y subtítulo. -->
                    <div>
                        <!-- Título. -->
                        <h1>Mis pedidos</h1>
                        <!-- Explicación del código. -->
                        <p class="muted">Cuando retires, mostrale al comercio el código de tu pedido.</p>
                    </div>
                </div>
            </header>
            <!-- Contenido. -->
            <section class="content">
                <!-- Pestañas de filtros. -->
                <nav class="tabs" aria-label="Filtrar pedidos">
                    <!-- Muestra todos. -->
                    <button class="tab active" data-estado="" type="button">Todos</button>
                    <!-- Filtra pendientes. -->
                    <button class="tab" data-estado="Pendiente" type="button">Pendientes</button>
                    <!-- Filtra preparación. -->
                    <button class="tab" data-estado="En preparación" type="button">En preparación</button>
                    <!-- Filtra listos. -->
                    <button class="tab" data-estado="Listo para retirar" type="button">Listos</button>
                </nav>
                <!-- Lista generada por JS. -->
                <section id="lista-pedidos"></section>
            </section>
            <!-- Navegación inferior. -->
            <nav class="bottom-nav">
                <!-- Inicio. -->
                <a href="../pantalla_inicio/todo_tala_pantalla_inicio.html">Inicio</a>
                <!-- Buscar. -->
                <a href="../resultados_busqueda/todo_tala_resultados_busqueda.html">Buscar</a>
                <!-- Catálogo. -->
                <a href="../catalogo_cliente/todo_tala_catalogo_cliente.html">Catálogo</a>
                <!-- Perfil. -->
                <a href="../perfil_cliente/tala_perfil_cliente.html">Perfil</a>
            </nav>
        </section>
    </main>
    <!-- Carga utilidades comunes. -->
    <script src="../assets/app.js"></script>
    <!-- Carga lógica de pedidos. -->
    <script src="pedidos.js"></script>
</body>
<!-- Finaliza el documento. -->
</html>
