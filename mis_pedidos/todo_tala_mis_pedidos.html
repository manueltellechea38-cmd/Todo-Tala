<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo Tala | Mis pedidos</title>
    <link rel="stylesheet" href="estilos.css?v=1.3.3">
</head>
<body>
    <main class="app-page">
        <section class="app-card orders-card">
            <!-- Encabezado y filtros de pedidos. -->
            <header class="app-header">
                <section class="app-header__title">
                    <a class="icon-button back-link" href="../pantalla_inicio/todo_tala_pantalla_inicio.html" aria-label="Volver">←</a>
                    <section>
                        <h1>Mis pedidos</h1>
                        <p class="muted">Revisá el estado, el código de retiro y tus pedidos anteriores.</p>
                    </section>
                </section>
            </header>

            <section class="content">
                <nav class="tabs" aria-label="Filtrar pedidos">
                    <button class="tab active" data-filtro="activos" type="button">Activos</button>
                    <button class="tab" data-filtro="finalizados" type="button">Finalizados</button>
                    <button class="tab" data-filtro="cancelados" type="button">Cancelados</button>
                </nav>

                <section id="lista-pedidos" class="order-list"></section>
            </section>

            <nav class="bottom-nav" aria-label="Navegación del cliente">
                <a href="../pantalla_inicio/todo_tala_pantalla_inicio.html">Inicio</a>
                <a href="../resultados_busqueda/todo_tala_resultados_busqueda.html">Buscar</a>
                <a href="../catalogo_cliente/todo_tala_catalogo_cliente.html">Catálogo</a>
                <a class="active" href="todo_tala_mis_pedidos.html">Pedidos</a>
                <a href="../perfil_cliente/tala_perfil_cliente.html">Perfil</a>
            </nav>
        </section>
    </main>

    <script src="../assets/app.js?v=1.3.3"></script>
    <script src="../assets/acceso.js?v=1.3.3"></script>
    <script src="pedidos.js?v=1.3.3"></script>
</body>
</html>
