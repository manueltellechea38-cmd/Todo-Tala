<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo Tala | Promociones</title>
    <link rel="stylesheet" href="estilos.css?v=1.3.3">
</head>
<body>
    <main class="app-page">
        <section class="app-card promotions-card">
            <!-- Encabezado de promociones. -->
            <header class="app-header">
                <section class="app-header__title">
                    <a class="icon-button back-link" href="../panel_comercio/todo_tala_panel_comercio.html" aria-label="Volver">←</a>
                    <section><h1>Promociones</h1><p class="muted">Creá promociones para los productos del comercio.</p></section>
                </section>
                <button id="btn-crear" class="btn btn--primary" type="button">Nueva promoción</button>
            </header>

            <section class="content promotions-content">
                <!-- Formulario de nueva promoción. -->
                <section id="panel-nueva" class="new-promo-panel" hidden>
                    <form id="form-promocion" class="form-grid">
                        <label class="form-group form-grid__full">Nombre *<input id="nombre-promo" type="text"></label>
                        <label class="form-group">Producto *<select id="producto-promo"></select></label>
                        <label class="form-group">Tipo *<select id="tipo-promo"><option value="porcentaje">Porcentaje</option><option value="precio">Precio promocional</option></select></label>
                        <label class="form-group">Valor *<input id="valor-promo" type="number" min="0"></label>
                        <label class="form-group">Estado<select id="activa"><option value="true">Activa</option><option value="false">Inactiva</option></select></label>
                        <label class="form-group">Inicio *<input id="inicio" type="date"></label>
                        <label class="form-group">Fin *<input id="fin" type="date"></label>
                        <p id="error-promo" class="error-message form-grid__full">Revisá los datos de la promoción.</p>
                        <button class="btn btn--primary form-grid__full" type="submit">Guardar promoción</button>
                    </form>
                </section>

                <section id="lista-promos" class="promo-list"></section>
            </section>

            <nav class="commerce-nav" aria-label="Navegación del comercio">
                <a href="../panel_comercio/todo_tala_panel_comercio.html">Panel</a>
                <a href="../gestionar_productos/todo_tala_gestion_productos.html">Productos</a>
                <a href="../pedidos_recibidos/todo_tala_pedidos_recibidos.html">Pedidos</a>
                <a class="active" href="todo_tala_gestion_promociones.html">Promociones</a>
                <a data-solo-jefe href="../gestionar_empleados/todo_tala_gestion_empleados.html">Empleados</a>
            </nav>
        </section>
    </main>

    <script src="../assets/app.js?v=1.3.3"></script>
    <script src="../assets/acceso.js?v=1.3.3"></script>
    <script src="promociones.js?v=1.3.3"></script>
</body>
</html>
