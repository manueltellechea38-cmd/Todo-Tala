<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo Tala | Pedidos recibidos</title>
    <link rel="stylesheet" href="estilos.css?v=1.3.3">
</head>
<body>
    <main class="app-page">
        <section class="app-card received-card">
            <!-- Encabezado de pedidos del comercio. -->
            <header class="app-header">
                <section class="app-header__title">
                    <a class="icon-button back-link" href="../panel_comercio/todo_tala_panel_comercio.html" aria-label="Volver">←</a>
                    <section><h1>Pedidos recibidos</h1><p class="muted">Actualizá estados y validá el código cuando el cliente retire.</p></section>
                </section>
            </header>

            <section class="content received-content">
                <!-- Búsqueda y filtro por estado. -->
                <form id="filtros-pedidos" class="order-filters">
                    <input id="buscar-pedido" type="search" placeholder="Código o cliente">
                    <select id="estado-pedido"><option value="">Todos los estados</option><option>Pendiente</option><option>Aceptado</option><option>En preparación</option><option>Listo para retirar</option><option>Entregado</option><option>Cancelado</option><option>Rechazado</option></select>
                </form>

                <section id="lista-pedidos" class="received-list"></section>
            </section>

            <nav class="commerce-nav" aria-label="Navegación del comercio">
                <a href="../panel_comercio/todo_tala_panel_comercio.html">Panel</a>
                <a href="../gestionar_productos/todo_tala_gestion_productos.html">Productos</a>
                <a class="active" href="todo_tala_pedidos_recibidos.html">Pedidos</a>
                <a href="../gestionar_promociones/todo_tala_gestion_promociones.html">Promociones</a>
                <a data-solo-jefe href="../gestionar_empleados/todo_tala_gestion_empleados.html">Empleados</a>
            </nav>
        </section>
    </main>

    <script src="../assets/app.js?v=1.3.3"></script>
    <script src="../assets/acceso.js?v=1.3.3"></script>
    <script src="pedidos-recibidos.js?v=1.3.3"></script>
</body>
</html>
