<!DOCTYPE html>
<!-- Declara HTML5. -->
<html lang="es">
<!-- Define idioma. -->
<head>
    <!-- Configura caracteres. -->
    <meta charset="UTF-8">
    <!-- Activa responsive. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Título. -->
    <title>Todo Tala | Editar producto</title>
    <!-- Carga estilos. -->
    <link rel="stylesheet" href="estilos.css">
</head>
<!-- Comienza interfaz. -->
<body>
    <!-- Contenedor. -->
    <main class="app-page">
        <!-- Tarjeta angosta. -->
        <section class="app-card app-card--narrow">
            <!-- Encabezado. -->
            <header class="app-header">
                <!-- Agrupa volver y título. -->
                <div class="app-header__title"><button id="btn-volver" class="icon-button" type="button" aria-label="Volver">←</button><h1>Editar producto</h1></div>
            </header>
            <!-- Contenido. -->
            <section class="content">
                <!-- Formulario. -->
                <form id="form-editar" class="form-grid" novalidate>
                    <!-- Nombre. -->
                    <div class="form-group form-grid__full"><label for="nombre">Nombre *</label><input id="nombre" type="text"></div>
                    <!-- Marca. -->
                    <div class="form-group"><label for="marca">Marca *</label><input id="marca" type="text"></div>
                    <!-- Categoría. -->
                    <div class="form-group"><label for="categoria">Categoría *</label><select id="categoria"><option>Panadería</option><option>Repostería</option><option>Almacén</option><option>Indumentaria</option><option>Tecnología</option><option>Ferretería</option></select></div>
                    <!-- Precio. -->
                    <div class="form-group"><label for="precio">Precio *</label><input id="precio" type="number" min="0"></div>
                    <!-- Stock. -->
                    <div class="form-group"><label for="stock">Stock *</label><input id="stock" type="number" min="0"><p id="stock-aviso" class="helper"></p></div>
                    <!-- Descripción. -->
                    <div class="form-group form-grid__full"><label for="descripcion">Descripción</label><textarea id="descripcion"></textarea></div>
                    <!-- Estado. -->
                    <div class="status-box form-grid__full"><div><strong>Producto publicado</strong><p class="helper">Si lo ocultás seguirá existiendo para el comercio.</p></div><input id="visible" type="checkbox"></div>
                    <!-- Error. -->
                    <p id="error-form" class="error-message form-grid__full">Revisá los campos obligatorios.</p>
                    <!-- Guarda. -->
                    <button class="btn btn--primary form-grid__full" type="submit">Guardar cambios</button>
                    <!-- Elimina. -->
                    <button id="btn-eliminar" class="btn btn--danger form-grid__full" type="button">Eliminar producto</button>
                </form>
            </section>
        </section>
    </main>
    <!-- Carga utilidades. -->
    <script src="../assets/app.js"></script>
    <!-- Carga lógica. -->
    <script src="editar-producto.js"></script>
</body>
<!-- Finaliza. -->
</html>
