<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo Tala | Editar producto</title><link rel="stylesheet" href="estilos.css?v=1.3">
</head>
<body>
<main class="app-page"><section class="app-card app-card--narrow">
<header class="app-header"><button id="btn-volver" class="icon-button" type="button" aria-label="Volver">←</button><h1>Editar producto</h1></header>
<section class="content">
<form id="form-editar" class="form-grid" novalidate>
<label class="form-group form-grid__full">Nombre *<input id="nombre" type="text"></label>
<label class="form-group">Marca *<input id="marca" type="text"></label>
<label class="form-group">Categoría *<select id="categoria"><option>Panadería</option><option>Repostería</option><option>Almacén</option><option>Indumentaria</option><option>Tecnología</option><option>Ferretería</option><option>Alimentos</option><option>Limpieza</option><option>Ropa</option></select></label>
<label class="form-group">Precio *<input id="precio" type="number" min="0"></label>
<label class="form-group">Stock *<input id="stock" type="number" min="0"><span id="stock-aviso" class="helper"></span></label>
<label class="form-group form-grid__full">Descripción<textarea id="descripcion"></textarea></label>
<label class="status-box form-grid__full"><span><strong>Producto publicado</strong><small class="helper">Desmarcá la opción para ocultarlo del catálogo.</small></span><input id="visible" type="checkbox"></label>
<p id="error-form" class="error-message form-grid__full">Revisá los campos obligatorios.</p>
<button class="btn btn--primary form-grid__full" type="submit">Guardar cambios</button>
<button id="btn-eliminar" class="btn btn--danger form-grid__full" type="button">Eliminar producto</button>
</form>
</section>
</section></main>
<script src="../assets/app.js?v=1.3"></script><script src="../assets/acceso.js?v=1.3"></script><script src="editar-producto.js?v=1.3"></script>
</body></html>
