<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo Tala | Empleados</title>
    <link rel="stylesheet" href="estilos.css?v=1.3">
</head>
<body>
    <main class="app-page">
        <section class="app-card employee-card">
            <header class="app-header">
                <section>
                    <h1>Administrar empleados</h1>
                    <p id="nombre-comercio" class="muted"></p>
                </section>
                <a class="btn btn--secondary" href="../panel_comercio/todo_tala_panel_comercio.html">Volver</a>
            </header>

            <section class="content employee-layout">
                <section>
                    <h2>Agregar empleado</h2>
                    <form id="form-empleado" class="employee-form">
                        <label>
                            Nombre y apellido
                            <input id="nombre" type="text" required>
                        </label>
                        <label>
                            Cédula
                            <input id="cedula" type="text" required>
                        </label>
                        <label>
                            Correo
                            <input id="correo" type="email" required>
                        </label>
                        <label>
                            Contraseña
                            <input id="password" type="password" minlength="8" required>
                        </label>
                        <label>
                            Fecha de nacimiento
                            <input id="fecha-nacimiento" type="date">
                        </label>
                        <p id="error-empleado" class="error-message"></p>
                        <button class="btn btn--primary" type="submit">Crear empleado</button>
                    </form>
                </section>

                <section>
                    <h2>Empleados registrados</h2>
                    <section id="lista-empleados" class="employee-list"></section>
                </section>
            </section>

            <nav class="commerce-nav" aria-label="Navegación del comercio">
                <a href="../panel_comercio/todo_tala_panel_comercio.html">Panel</a>
                <a href="../gestioinar_productos/todo_tala_gestion_productos.html">Productos</a>
                <a href="../pedidos_recibidos/todo_tala_pedidos_recibidos.html">Pedidos</a>
                <a href="../gestionar_promociones/todo_tala_gestion_promociones.html">Promociones</a>
                <a class="active" href="todo_tala_gestion_empleados.html">Empleados</a>
            </nav>
        </section>
    </main>

    <script src="../assets/app.js?v=1.3"></script>
    <script src="../assets/acceso.js?v=1.3"></script>
    <script src="empleados.js?v=1.3"></script>
</body>
</html>
