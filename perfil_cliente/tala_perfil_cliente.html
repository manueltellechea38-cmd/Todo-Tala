<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo Tala | Mi perfil</title>
    <link rel="stylesheet" href="estilos.css?v=1.3.3">
</head>
<body>
    <main class="app-page">
        <section class="app-card profile-card">
            <!-- Encabezado del perfil. -->
            <header class="app-header">
                <section class="app-header__title">
                    <a class="icon-button back-link" href="../pantalla_inicio/todo_tala_pantalla_inicio.html" aria-label="Volver">←</a>
                    <h1>Mi perfil</h1>
                </section>
                <button id="btn-salir" class="btn btn--danger" type="button">Cerrar sesión</button>
            </header>

            <section class="content profile-content">
                <!-- Datos principales del cliente. -->
                <header class="profile-summary">
                    <span id="avatar" class="avatar">TT</span>
                    <section>
                        <h2 id="nombre-visible"></h2>
                        <p class="muted">Cliente</p>
                    </section>
                </header>

                <section class="profile-data">
                    <article><small>Correo</small><strong id="email-visible"></strong></article>
                    <article><small>Cédula</small><strong id="cedula-visible"></strong></article>
                    <article><small>Fecha de nacimiento</small><strong id="fecha-visible"></strong></article>
                </section>

                <button id="btn-editar" class="btn btn--primary" type="button">Editar datos</button>

                <!-- Formulario de edición. -->
                <form id="form-edicion" class="edit-panel" hidden>
                    <label>Nombre y apellido<input id="nombre" type="text" required></label>
                    <label>Correo<input id="email" type="email" required></label>
                    <label>Fecha de nacimiento<input id="fecha-nacimiento" type="date"></label>
                    <p id="error-perfil" class="error-message">Revisá el nombre y el correo.</p>
                    <button class="btn btn--primary" type="submit">Guardar cambios</button>
                </form>
            </section>

            <nav class="bottom-nav" aria-label="Navegación del cliente">
                <a href="../pantalla_inicio/todo_tala_pantalla_inicio.html">Inicio</a>
                <a href="../resultados_busqueda/todo_tala_resultados_busqueda.html">Buscar</a>
                <a href="../catalogo_cliente/todo_tala_catalogo_cliente.html">Catálogo</a>
                <a href="../mis_pedidos/todo_tala_mis_pedidos.html">Pedidos</a>
                <a class="active" href="tala_perfil_cliente.html">Perfil</a>
            </nav>
        </section>
    </main>

    <script src="../assets/app.js?v=1.3.3"></script>
    <script src="../assets/acceso.js?v=1.3.3"></script>
    <script src="perfil.js?v=1.3.3"></script>
</body>
</html>
