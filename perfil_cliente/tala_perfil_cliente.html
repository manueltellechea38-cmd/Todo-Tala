<!DOCTYPE html>
<!-- Declara HTML5. -->
<html lang="es">
<!-- Define idioma. -->
<head>
    <!-- Configura caracteres. -->
    <meta charset="UTF-8">
    <!-- Activa responsive. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Título de pestaña. -->
    <title>Todo Tala | Mi perfil</title>
    <!-- Carga estilos. -->
    <link rel="stylesheet" href="estilos.css">
</head>
<!-- Comienza la interfaz. -->
<body>
    <!-- Contenedor general. -->
    <main class="app-page">
        <!-- Tarjeta angosta. -->
        <section class="app-card app-card--narrow">
            <!-- Encabezado. -->
            <header class="app-header">
                <!-- Agrupa volver y título. -->
                <div class="app-header__title">
                    <!-- Regresa al catálogo. -->
                    <button id="btn-volver" class="icon-button" type="button" aria-label="Volver">←</button>
                    <!-- Título. -->
                    <h1>Mi perfil</h1>
                </div>
            </header>
            <!-- Contenido. -->
            <section class="content">
                <!-- Resumen de usuario. -->
                <section class="profile-summary">
                    <!-- Avatar. -->
                    <div id="avatar" class="avatar">MR</div>
                    <!-- Nombre. -->
                    <h2 id="nombre-visible">Manuel Rodríguez</h2>
                    <!-- Rol. -->
                    <p class="muted">Cliente del MVP</p>
                </section>
                <!-- Datos visibles. -->
                <section class="card-grid">
                    <!-- Correo. -->
                    <article class="mini-card"><small class="muted">Correo</small><p id="email-visible"></p></article>
                    <!-- Teléfono. -->
                    <article class="mini-card"><small class="muted">Teléfono</small><p id="telefono-visible"></p></article>
                </section>
                <!-- Acciones. -->
                <div class="toolbar" style="margin-top:18px;">
                    <!-- Abre edición. -->
                    <button id="btn-editar" class="btn btn--primary" type="button">Editar datos</button>
                    <!-- Cierra sesión demo. -->
                    <button id="btn-salir" class="btn btn--danger" type="button">Cerrar sesión</button>
                </div>
                <!-- Panel editable. -->
                <form id="form-edicion" class="edit-panel">
                    <!-- Nombre. -->
                    <div class="form-group"><label for="nombre">Nombre</label><input id="nombre" type="text"></div>
                    <!-- Correo. -->
                    <div class="form-group"><label for="email">Correo</label><input id="email" type="email"></div>
                    <!-- Teléfono. -->
                    <div class="form-group"><label for="telefono">Teléfono</label><input id="telefono" type="tel"></div>
                    <!-- Guarda. -->
                    <button class="btn btn--primary" type="submit">Guardar cambios</button>
                </form>
            </section>
            <!-- Navegación inferior. -->
            <nav class="bottom-nav">
                <!-- Inicio. -->
                <a href="../pantalla_inicio/todo_tala_pantalla_inicio.html">Inicio</a>
                <!-- Buscar. -->
                <a href="../resultados_busqueda/todo_tala_resultados_busqueda.html">Buscar</a>
                <!-- Catálogo. -->
                <a href="../catalogo_cliente/todo_tala_catalogo_cliente.html">Catálogo</a>
                <!-- Perfil activo. -->
                <a class="active" href="tala_perfil_cliente.html">Perfil</a>
            </nav>
        </section>
    </main>
    <!-- Carga utilidades. -->
    <script src="../assets/app.js"></script>
    <!-- Carga lógica del perfil. -->
    <script src="perfil.js"></script>
</body>
<!-- Finaliza documento. -->
</html>
