<head>

</head>
<body>
<main class="app-page"><section class="app-card app-card--narrow">
<header class="app-header"><h1>Mi perfil</h1></header>
<section class="content">
<section class="profile-summary"><span id="avatar" class="avatar">JP</span><h2 id="nombre-visible"></h2><p class="muted">Cliente</p></section>
<section class="card-grid"><article class="mini-card"><small class="muted">Correo</small><p id="email-visible"></p></article><article class="mini-card"><small class="muted">Teléfono</small><p id="telefono-visible"></p></article></section>
<nav class="toolbar profile-actions"><button id="btn-editar" class="btn btn--primary" type="button">Editar datos</button><button id="btn-salir" class="btn btn--danger" type="button">Cerrar sesión</button></nav>
<form id="form-edicion" class="edit-panel">
<label class="form-group">Nombre<input id="nombre" type="text" required></label>
<label class="form-group">Correo<input id="email" type="email" required></label>
<label class="form-group">Teléfono<input id="telefono" type="tel"></label>
<button class="btn btn--primary" type="submit">Guardar cambios</button>
</form>
</section>
