<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo Tala | Inicio</title>
    <link rel="stylesheet" href="estilos.css?v=1.3.1">
</head>
<body>
    <main class="app-page home-page">
        <section class="app-card home-card">
            <!-- Encabezado principal del cliente. -->
            <header class="home-header">
                <nav class="top-nav" aria-label="Navegación superior">
                    <a class="brand" href="todo_tala_pantalla_inicio.html">
                        <span class="brand-mark">TT</span>
                        <strong>Todo Tala</strong>
                    </a>
                    <p id="saludo" class="muted"></p>
                    <a class="btn btn--secondary" href="../carrito_pedidos/todo_tala_carrito_pedido.html">Carrito</a>
                    <a class="btn btn--secondary" href="../perfil_cliente/tala_perfil_cliente.html">Mi perfil</a>
                    <button id="btn-salir" class="btn btn--danger" type="button">Salir</button>
                </nav>

                <section class="hero-copy">
                    <h1>Encontrá lo que necesitás cerca de vos.</h1>
                    <p>Buscá productos, consultá stock y armá tu pedido para retirar en el comercio.</p>
                </section>

                <!-- Buscador principal. -->
                <form id="form-busqueda" class="home-search" role="search">
                    <input id="busqueda-inicio" type="search" placeholder="Buscar productos o comercios..." autocomplete="off">
                    <button class="btn btn--primary" type="submit">Buscar</button>
                </form>
            </header>

            <!-- Contenido destacado de la portada. -->
            <section class="home-content">
                <section>
                    <header class="section-heading">
                        <h2>Promociones destacadas</h2>
                    </header>
                    <section id="promo-grid" class="promo-grid"></section>
                </section>

                <section>
                    <header class="section-heading">
                        <h2>Productos destacados</h2>
                        <a class="btn btn--secondary" href="../catalogo_cliente/todo_tala_catalogo_cliente.html">Ver catálogo</a>
                    </header>
                    <section id="preview-grid" class="preview-grid"></section>
                </section>
            </section>

            <!-- Barra fija de navegación del cliente. -->
            <nav class="bottom-nav" aria-label="Navegación del cliente">
                <a class="active" href="todo_tala_pantalla_inicio.html">Inicio</a>
                <a href="../resultados_busqueda/todo_tala_resultados_busqueda.html">Buscar</a>
                <a href="../catalogo_cliente/todo_tala_catalogo_cliente.html">Catálogo</a>
                <a href="../mis_pedidos/todo_tala_mis_pedidos.html">Pedidos</a>
                <a href="../perfil_cliente/tala_perfil_cliente.html">Perfil</a>
            </nav>
        </section>
    </main>

    <script src="../assets/app.js?v=1.3.1"></script>
    <script src="../assets/acceso.js?v=1.3.1"></script>
    <script src="inicio.js?v=1.3.1"></script>
</body>
</html>
