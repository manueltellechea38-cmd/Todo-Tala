<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo Tala | Buscar</title>
    <link rel="stylesheet" href="estilos.css?v=1.3.3">
</head>
<body>
    <main class="app-page">
        <section class="app-card search-card">
            <!-- Encabezado de búsqueda. -->
            <header class="app-header">
                <section class="app-header__title">
                    <a class="icon-button back-link" href="../pantalla_inicio/todo_tala_pantalla_inicio.html" aria-label="Volver">←</a>
                    <section>
                        <h1>Buscar productos</h1>
                        <p class="muted">Filtrá por nombre, categoría, precio o stock.</p>
                    </section>
                </section>
            </header>

            <section class="content">
                <!-- Controles principales. -->
                <form id="form-busqueda" class="search-controls">
                    <label class="form-group">Producto, marca o comercio<input id="search-input" type="search" placeholder="Ej: arroz, ropa, ferretería"></label>
                    <label class="form-group">Categoría<select id="categoria"><option value="">Todas</option></select></label>
                    <label class="form-group">Precio máximo<input id="precio-max" type="number" min="0" placeholder="Sin límite"></label>
                    <button class="btn btn--primary" type="submit">Buscar</button>
                </form>

                <label class="stock-check" for="solo-stock"><input id="solo-stock" type="checkbox">Mostrar solo productos con stock</label>
                <p id="resumen" class="muted search-summary"></p>
                <section id="lista-resultados" class="result-list"></section>
            </section>

            <nav class="bottom-nav" aria-label="Navegación del cliente">
                <a href="../pantalla_inicio/todo_tala_pantalla_inicio.html">Inicio</a>
                <a class="active" href="todo_tala_resultados_busqueda.html">Buscar</a>
                <a href="../catalogo_cliente/todo_tala_catalogo_cliente.html">Catálogo</a>
                <a href="../mis_pedidos/todo_tala_mis_pedidos.html">Pedidos</a>
                <a href="../perfil_cliente/tala_perfil_cliente.html">Perfil</a>
            </nav>
        </section>
    </main>

    <script src="../assets/app.js?v=1.3.3"></script>
    <script src="../assets/acceso.js?v=1.3.3"></script>
    <script src="buscar-productos.js?v=1.3.3"></script>
</body>
</html>
